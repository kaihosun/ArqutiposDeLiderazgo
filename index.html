    * { box-sizing: border-box; }

    body {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: #e9ecef;
        color: var(--dark);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        background: white;
        width: 100%;
        max-width: 750px;
        padding: 2.5rem;
        border-radius: 4px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        border-top: 4px solid var(--primary);
    }

    h1 {
        color: var(--dark);
        text-align: center;
        font-weight: 300;
        letter-spacing: 1px;
        margin-bottom: 0.5rem;
    }

    h2 { color: var(--dark); text-align: center; font-weight: 300; }

    .subtitle {
        text-align: center;
        color: var(--gray);
        margin-bottom: 2.5rem;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .form-group { margin-bottom: 1.2rem; }

    label {
        display: block;
        margin-bottom: 0.4rem;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--dark);
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 3px;
        font-size: 1rem;
        box-sizing: border-box;
        transition: border-color 0.2s;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
    }

    .question-counter {
        font-size: 0.8rem;
        color: var(--gray);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 0.5rem;
    }

    .question-text {
        font-size: 1.1rem;
        margin-bottom: 1.5rem;
        font-weight: 500;
        line-height: 1.5;
    }

    .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .option-btn {
        background: white;
        border: 1px solid var(--border);
        padding: 14px 16px;
        text-align: left;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.93rem;
        color: var(--dark);
        line-height: 1.4;
    }

    .option-btn:hover {
        border-color: var(--primary);
        background-color: #f0f8ff;
    }

    .option-btn.selected {
        background-color: var(--dark);
        color: white;
        border-color: var(--dark);
    }

    .nav-buttons {
        margin-top: 2rem;
        display: flex;
        justify-content: flex-end;
    }

    button.primary-btn {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: background 0.3s;
    }

    button.primary-btn:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: #adb5bd; cursor: not-allowed; }

    .progress-container {
        width: 100%;
        background-color: #e9ecef;
        height: 6px;
        border-radius: 3px;
        margin-bottom: 2rem;
        display: none;
    }

    .progress-bar {
        height: 6px;
        background-color: var(--primary);
        border-radius: 3px;
        width: 0%;
        transition: width 0.3s ease;
    }

    .result-screen { display: none; }

    .result-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .archetype-badge {
        display: inline-block;
        font-family: 'Courier New', Courier, monospace;
        font-size: 1rem;
        font-weight: bold;
        color: white;
        background: var(--dark);
        padding: 6px 16px;
        border-radius: 3px;
        margin-bottom: 1rem;
    }

    .archetype-name {
        font-size: 1.8rem;
        font-weight: 300;
        color: var(--dark);
        margin: 0.5rem 0;
    }

    .archetype-tagline {
        font-size: 1rem;
        color: var(--gray);
        font-style: italic;
    }

    .result-section {
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
    }

    .result-section h3 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--gray);
        margin-bottom: 0.8rem;
    }

    .result-section p, .result-section li {
        font-size: 0.93rem;
        line-height: 1.6;
        color: var(--dark);
    }

    .result-section ul {
        padding-left: 1.2rem;
        margin: 0;
    }

    .result-section li { margin-bottom: 0.4rem; }

    .scores-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 1rem;
    }

    .score-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
    }

    .score-bar-bg {
        flex: 1;
        height: 8px;
        background: #e9ecef;
        border-radius: 4px;
        overflow: hidden;
    }

    .score-bar-fill {
        height: 100%;
        background: var(--primary);
        border-radius: 4px;
        transition: width 0.5s ease;
    }

    .score-bar-fill.top { background: var(--dark); }

    .score-label { min-width: 80px; font-weight: 500; }
    .score-value { min-width: 25px; text-align: right; color: var(--gray); }

    .info-data {
        text-align: left;
        margin-top: 20px;
        font-size: 0.85rem;
        color: var(--gray);
        border-top: 1px solid var(--border);
        padding-top: 15px;
    }

    .info-data p { margin: 4px 0; }

    .error-msg {
        color: #dc3545;
        font-size: 0.85rem;
        margin-top: 5px;
        display: none;
    }

    .btn-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 2rem;
    }

    .btn-secondary {
        background-color: var(--gray);
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    @media print {
        body { background: white; }
        .container { box-shadow: none; border-top: none; max-width: 100%; }
        .btn-row { display: none; }
    }
</style>

// ============================================================
// GAME LOGIC
// ============================================================

let currentQuestions = [];
let currentQuestionIndex = 0;
let scores = {};
let userData = {};

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startTest() {
    const name = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const position = document.getElementById('position').value.trim();

    if (!name || !phone || !email) {
        document.getElementById('form-error').style.display = 'block';
        return;
    }

    userData = { name, phone, email, position };

    scores = {};
    Object.keys(archetypeData).forEach(k => scores[k] = 0);

    // Clone, shuffle questions AND options within each question
    currentQuestions = questionsPool.map(q => ({
        text: q.text,
        options: shuffleArray(q.options.map(o => ({...o})))
    }));
    currentQuestions = shuffleArray(currentQuestions);

    currentQuestionIndex = 0;

    document.getElementById('intro-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.querySelector('.progress-container').style.display = 'block';

    renderQuestion();
}

function renderQuestion() {
    const qContainer = document.getElementById('question-container');
    const qData = currentQuestions[currentQuestionIndex];
    const total = currentQuestions.length;
    
    const progress = (currentQuestionIndex / total) * 100;
    document.getElementById('progress-bar').style.width = `${progress}%`;

    let html = `
        <div class="question-counter">Pregunta ${currentQuestionIndex + 1} de ${total}</div>
        <div class="question-text">${qData.text}</div>
        <div class="options">
    `;

    qData.options.forEach((opt) => {
        const escapedType = opt.type.replace(/'/g, "\\'");
        html += `<button class="option-btn" onclick="selectOption(this, '${escapedType}')">${opt.text}</button>`;
    });

    html += `</div>`;
    qContainer.innerHTML = html;
    document.getElementById('next-btn').disabled = true;
}

function selectOption(btn, type) {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    btn.parentElement.dataset.selectedType = type;
    document.getElementById('next-btn').disabled = false;
}

function nextQuestion() {
    const selectedBtn = document.querySelector('.option-btn.selected');
    if (!selectedBtn) return;

    const type = selectedBtn.parentElement.dataset.selectedType;
    scores[type]++;

    currentQuestionIndex++;

    if (currentQuestionIndex < currentQuestions.length) {
        renderQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-screen').style.display = 'none';
    
    // Find winner (and handle ties by picking the one that appeared first in a stable sort)
    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const winnerCode = sorted[0][0];
    const winner = archetypeData[winnerCode];
    const maxPossible = currentQuestions.length; // theoretical max if all questions had this type

    // Build result HTML
    const resultDiv = document.getElementById('result-screen');
    
    let scoresHTML = '';
    sorted.forEach(([code, score], i) => {
        const pct = (score / sorted[0][1]) * 100; // relative to top score
        const data = archetypeData[code];
        const isTop = i === 0;
        scoresHTML += `
            <div class="score-item">
                <span class="score-label">${data.emperor}</span>
                <div class="score-bar-bg">
                    <div class="score-bar-fill ${isTop ? 'top' : ''}" style="width: ${Math.max(pct, 5)}%"></div>
                </div>
                <span class="score-value">${score}</span>
            </div>
        `;
    });

    resultDiv.innerHTML = `
        <div class="result-header">
            <h2>Evaluación Finalizada</h2>
            <div class="archetype-badge">${winner.code}</div>
            <div class="archetype-name">${winner.name}</div>
            <div class="archetype-tagline">"${winner.tagline}"</div>
        </div>

        <div class="result-section">
            <h3>Tu Perfil</h3>
            <p>${winner.description}</p>
        </div>

        <div class="result-section">
            <h3>Fortalezas Principales</h3>
            <ul>${winner.strengths.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>

        <div class="result-section">
            <h3>Riesgos a Monitorear</h3>
            <ul>${winner.risks.map(r => `<li>${r}</li>`).join('')}</ul>
        </div>

        <div class="result-section">
            <h3>Áreas de Desarrollo Prioritarias</h3>
            <ul>${winner.devAreas.map(d => `<li>${d}</li>`).join('')}</ul>
        </div>

        <div class="result-section">
            <h3>Distribución de Resultados</h3>
            <div class="scores-grid">${scoresHTML}</div>
        </div>

        <div class="info-data">
            <p><strong>Colaborador:</strong> ${userData.name}</p>
            ${userData.position ? `<p><strong>Puesto:</strong> ${userData.position}</p>` : ''}
            <p><strong>Contacto:</strong> ${userData.email}</p>
            <p><strong>Fecha:</strong> ${new Date().toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
        </div>

        <div class="btn-row">
            <button class="btn-secondary" onclick="window.print()">Imprimir</button>
            <button class="primary-btn" onclick="location.reload()">Nueva Evaluación</button>
        </div>
    `;

    resultDiv.style.display = 'block';
}
